<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Smart Ward Map Viewer & KML Downloader</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/tokml@0.4.0/tokml.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-wrap: wrap;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #goBtn {
            background-color: #3498db;
            min-width: 80px;
        }
        #goBtn:hover:not(:disabled) {
            background-color: #2980b9;
        }
        #downloadBtn {
            background-color: #27ae60;
        }
        #downloadBtn:hover:not(:disabled) {
            background-color: #2ecc71;
        }
        button:disabled {
            background-color: #95a5a6 !important;
            cursor: not-allowed;
        }
        #loadingText {
            display: none;
            color: #d35400;
            font-weight: bold;
            font-size: 14px;
        }
        #map {
            height: calc(100vh - 140px);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>K-Smart Ward Map Viewer & KML Downloader</h2>
    </div>

    <div class="controls">
        <select id="districtSelect">
            <option value="">Select District (ജില്ല)</option>
        </select>
        
        <select id="panchayatSelect" disabled>
            <option value="">Select Panchayat (പഞ്ചായത്ത്)</option>
        </select>
        
        <button id="goBtn" disabled>Go</button>
        <button id="downloadBtn" disabled>Download KML</button>
        <span id="loadingText">Loading Data... Please Wait</span>
    </div>

    <div id="map"></div>

    <script>
        const distSelect = document.getElementById('districtSelect');
        const panSelect = document.getElementById('panchayatSelect');
        const goBtn = document.getElementById('goBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingText = document.getElementById('loadingText');
        
        let dataMap = {};
        let currentLayer = null;
        let currentGeoJSON = null;
        let currentPanchayatName = "";

        // 1. Fetch URLs from GitHub Text File on Page Load
        fetch('https://raw.githubusercontent.com/Vonter/kerala-wards/main/urls.txt')
            .then(response => response.text())
            .then(text => {
                text.split('\n').forEach(url => {
                    const cleanUrl = url.trim();
                    if (!cleanUrl) return;
                    
                    const parts = cleanUrl.split('/');
                    const filename = parts[parts.length - 1]; 
                    const nameParts = filename.split('_');
                    
                    if (nameParts.length >= 2) {
                        const district = nameParts[0];
                        const panchayat = nameParts[1];
                        
                        if (!dataMap[district]) dataMap[district] = [];
                        dataMap[district].push({ name: panchayat, url: cleanUrl });
                    }
                });

                // Populate District Dropdown
                Object.keys(dataMap).sort().forEach(district => {
                    let option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    distSelect.appendChild(option);
                });
            })
            .catch(err => {
                console.error(err);
                alert("GitHub file-il ninnum URL list load cheyyan kazhinjilla. Internet connection check cheyyuka.");
            });

        // Initialize Map (Google Roads)
        const map = L.map('map').setView([10.8505, 76.2711], 7);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: 'Map data © Google',
            maxZoom: 20
        }).addTo(map);

        // 2. Handle District Change
        distSelect.addEventListener('change', (e) => {
            const district = e.target.value;
            panSelect.innerHTML = '<option value="">Select Panchayat (പഞ്ചായത്ത്)</option>';
            panSelect.disabled = !district;
            goBtn.disabled = true;
            downloadBtn.disabled = true;

            if (district && dataMap[district]) {
                dataMap[district].sort((a,b) => a.name.localeCompare(b.name)).forEach(panchayat => {
                    let option = document.createElement('option');
                    option.value = panchayat.url;
                    option.textContent = panchayat.name;
                    panSelect.appendChild(option);
                });
            }
        });

        // 3. Handle Panchayat Change (Enable Go Button)
        panSelect.addEventListener('change', (e) => {
            const url = e.target.value;
            goBtn.disabled = !url;
            downloadBtn.disabled = true; // Disable download until map is loaded
        });

        // 4. Handle "Go" Button Click (Load JSON to Map)
        goBtn.addEventListener('click', () => {
            const url = panSelect.value;
            if (!url) return;
            
            currentPanchayatName = panSelect.options[panSelect.selectedIndex].text;
            
            // UI Changes during loading
            goBtn.disabled = true;
            panSelect.disabled = true;
            distSelect.disabled = true;
            downloadBtn.disabled = true;
            loadingText.style.display = "inline";

            // Proxy to avoid CORS
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Network response error");
                    return response.json();
                })
                .then(geoJsonData => {
                    if (currentLayer) map.removeLayer(currentLayer);
                    
                    currentGeoJSON = geoJsonData;
                    
                    currentLayer = L.geoJSON(geoJsonData, {
                        style: { color: "#d35400", weight: 2, opacity: 1, fillOpacity: 0.2 },
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                let popupContent = "<b>Panchayat:</b> " + currentPanchayatName + "<br>";
                                if(feature.properties.ward_name) popupContent += "<b>Ward:</b> " + feature.properties.ward_name + "<br>";
                                if(feature.properties.ward_no) popupContent += "<b>Ward No:</b> " + feature.properties.ward_no;
                                layer.bindPopup(popupContent);
                            }
                        }
                    }).addTo(map);
                    
                    map.fitBounds(currentLayer.getBounds());
                    
                    // Reset UI
                    downloadBtn.disabled = false;
                    goBtn.disabled = false;
                    panSelect.disabled = false;
                    distSelect.disabled = false;
                    loadingText.style.display = "none";
                })
                .catch(err => {
                    console.error(err);
                    alert("Data load aakunilla. Panchayat file exist aavunnundo ennu urappu varuthuka.");
                    
                    // Reset UI on error
                    goBtn.disabled = false;
                    panSelect.disabled = false;
                    distSelect.disabled = false;
                    loadingText.style.display = "none";
                });
        });

        // 5. Download KML
        downloadBtn.addEventListener('click', () => {
            if (!currentGeoJSON) return;
            try {
                const kml = tokml(currentGeoJSON, {
                    documentName: currentPanchayatName,
                    documentDescription: 'Converted from K-Smart GeoJSON'
                });
                
                const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentPanchayatName.replace(/\s+/g, '_')}_WardMap.kml`;
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                alert("KML aayi convert cheyyan sadhichilla.");
            }
        });
    </script>
</body>
</html>
