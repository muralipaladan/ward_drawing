<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Smart Ward Map</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tokml for KML Export & Fuse.js for Search[cite: 1] -->
    <script src="https://unpkg.com/tokml@0.4.0/tokml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script> 
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background-color: #f8f9fa; overflow: hidden; }
        
        /* Page Views */
        .page { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .page.active { display: block; }

        /* --- PAGE 1: Search Page Styles --- */
        #page1 { display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #2c3e50, #3498db); color: white; }
        .title-box { text-align: center; margin-bottom: 30px; }
        .title-box h1 { font-size: 40px; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .title-box p { font-size: 18px; opacity: 0.8; }
        
        .search-container { position: relative; width: 400px; max-width: 90%; }
        #smartSearch { width: 100%; padding: 15px 20px; font-size: 18px; border: none; border-radius: 30px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        #smartSearch:disabled { background-color: #ecf0f1; cursor: not-allowed; }
        
        .suggestions-box { position: absolute; top: 100%; left: 5%; right: 5%; background: white; color: #333; border-radius: 0 0 15px 15px; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none; z-index: 1000; margin-top: 5px; }
        .suggestion-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #f1f1f1; font-size: 16px; transition: 0.2s; }
        .suggestion-item:last-child { border-bottom: none; border-radius: 0 0 15px 15px; }
        .suggestion-item:hover { background-color: #3498db; color: white; padding-left: 20px; }
        .district-label { font-size: 13px; opacity: 0.7; margin-left: 5px; }

        #loadingText { margin-top: 20px; font-size: 16px; color: #f1c40f; font-weight: bold; animation: blink 1s infinite; display: none; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- PAGE 2: Map Page Styles --- */
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* Custom Controls Bottom Right */
        .map-controls { position: absolute; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        .control-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: white; color: #333; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        
        #gpsBtn { color: #2980b9; }
        #gpsBtn:hover { background: #2980b9; color: white; }
        
        #downloadBtn { color: #27ae60; }
        #downloadBtn:hover { background: #27ae60; color: white; }
        
        #homeBtn { color: #c0392b; }
        #homeBtn:hover { background: #c0392b; color: white; }

        /* Loader Overlay for Map */
        #mapLoader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #2c3e50; display: none; }
    </style>
</head>
<body>

    <!-- PAGE 1: Search View -->
    <div id="page1" class="page active">
        <div class="title-box">
            <h1>K-Smart Ward Map</h1>
            <p>Search and Download Panchayat Ward Maps</p>
        </div>
        <div class="search-container">
            <input type="text" id="smartSearch" placeholder="⏳ Loading Panchayats..." autocomplete="off" disabled>
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        <div id="loadingText">Fetching Data... Please wait.</div>
    </div>

    <!-- PAGE 2: Full Screen Map View -->
    <div id="page2" class="page">
        <div id="mapLoader"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Loading Map Data...</div>
        <div id="map"></div>
        
        <!-- Bottom Right Controls Only -->
        <div class="map-controls">
            <button class="control-btn" id="gpsBtn" title="Live GPS Location"><i class="fas fa-crosshairs"></i></button>
            <button class="control-btn" id="downloadBtn" title="Download KML"><i class="fas fa-download"></i></button>
            <button class="control-btn" id="homeBtn" title="Back to Home"><i class="fas fa-home"></i></button>
        </div>
    </div>

    <script>
        // DOM Elements
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const smartSearch = document.getElementById('smartSearch');
        const suggestionsBox = document.getElementById('suggestions');
        const loadingText = document.getElementById('loadingText');
        const mapLoader = document.getElementById('mapLoader');
        
        const gpsBtn = document.getElementById('gpsBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const homeBtn = document.getElementById('homeBtn');

        let allData = [];
        let fuse = null; 
        let currentLayer = null;
        let currentPanchayatName = "";
        let map = null;
        let gpsMarker = null;

        // 1. Fetch URLs from GitHub[cite: 1]
        fetch('https://raw.githubusercontent.com/muralipaladan/ward_drawing/main/urls.txt')
            .then(response => response.text())
            .then(text => {
                text.split('\n').forEach(url => {
                    const cleanUrl = url.trim();
                    if (!cleanUrl) return;
                    
                    const parts = cleanUrl.split('/');
                    const filename = parts[parts.length - 1]; 
                    const nameParts = filename.split('_');
                    
                    if (nameParts.length >= 2) {
                        allData.push({
                            district: nameParts[0],
                            panchayat: nameParts[1],
                            url: cleanUrl
                        });
                    }
                });

                const options = { keys: ['panchayat', 'district'], threshold: 0.3, distance: 100 };
                fuse = new Fuse(allData, options); // Initialize Fuse.js for search[cite: 1]
                
                smartSearch.disabled = false;
                smartSearch.placeholder = `🔍 Search Panchayat...`;
            })
            .catch(err => {
                smartSearch.placeholder = "❌ Error Loading Data";
            });

        // 2. Search Input Event (Auto-suggest)[cite: 1]
        smartSearch.addEventListener('input', function() {
            const query = this.value;
            suggestionsBox.innerHTML = '';
            
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const results = fuse.search(query).slice(0, 15);
            
            if (results.length > 0) {
                suggestionsBox.style.display = 'block';
                results.forEach(result => {
                    const item = result.item;
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `${item.panchayat} <span class="district-label">(${item.district})</span>`;
                    
                    // On Panchayat Click
                    div.addEventListener('click', () => {
                        smartSearch.value = '';
                        suggestionsBox.style.display = 'none';
                        currentPanchayatName = item.panchayat;
                        openMapPage(item.url);
                    });
                    
                    suggestionsBox.appendChild(div);
                });
            } else {
                suggestionsBox.style.display = 'none';
            }
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (!smartSearch.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });

        // 3. Initialize Map and Load GeoJSON
        function openMapPage(geojsonUrl) {
            // Switch Pages
            page1.classList.remove('active');
            page2.classList.add('active');
            mapLoader.style.display = 'flex';

            // Initialize Map if not already done (Zoom control hidden as requested)
            if (!map) {
                const googleRoads = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20
                });
                
                map = L.map('map', {
                    zoomControl: false, // Default tools removed
                    layers: [googleRoads]
                });
            }

            // Remove previous layers
            if (currentLayer) map.removeLayer(currentLayer);
            if (gpsMarker) map.removeLayer(gpsMarker);

            // പ്രോക്സി ഒഴിവാക്കി നേരിട്ട് ഫെച്ച് ചെയ്യുന്നു
            fetch(geojsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(geoJsonData => {
                    // Injecting KML style properties for pink outline and transparent fill
                    geoJsonData.features.forEach(feature => {
                        if (!feature.properties) feature.properties = {};
                        feature.properties.stroke = "#FF69B4"; // Pink
                        feature.properties["stroke-width"] = 2;
                        feature.properties["fill-opacity"] = 0; // Transparent
                    });

                    // Add to map with Pink / Transparent styling
                    currentLayer = L.geoJSON(geoJsonData, {
                        style: { 
                            color: "#FF69B4", // Pink borders
                            weight: 3, 
                            opacity: 1, 
                            fillOpacity: 0  // Transparent area
                        },
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                let popupContent = `<b>${currentPanchayatName}</b><br>`;
                                if(feature.properties.ward_name) popupContent += `Ward: ${feature.properties.ward_name}<br>`;
                                if(feature.properties.ward_no) popupContent += `Ward No: ${feature.properties.ward_no}`;
                                layer.bindPopup(popupContent);
                            }
                        }
                    }).addTo(map);
                    
                    map.fitBounds(currentLayer.getBounds());
                    setTimeout(() => { map.invalidateSize(); }, 200); // Fix rendering issues
                    mapLoader.style.display = 'none';
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    alert("മാപ്പ് ലോഡ് ചെയ്യാൻ സാധിച്ചില്ല. ദയവായി വീണ്ടും ശ്രമിക്കുക.");
                    goHome();
                });
        }

        // 4. GPS Live Location Logic
        gpsBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                gpsBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    if(gpsMarker) map.removeLayer(gpsMarker);
                    
                    // Blue dot for GPS
                    gpsMarker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: "#3498db",
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 1
                    }).addTo(map);
                    
                    map.flyTo([lat, lng], 16);
                    gpsBtn.innerHTML = '<i class="fas fa-crosshairs"></i>';
                }, () => {
                    alert("GPS ലൊക്കേഷൻ കണ്ടെത്താൻ സാധിച്ചില്ല. ബ്രൗസറിൽ Location Permission നൽകിയിട്ടുണ്ടോ എന്ന് ഉറപ്പുവരുത്തുക.");
                    gpsBtn.innerHTML = '<i class="fas fa-crosshairs"></i>';
                });
            } else {
                alert("നിങ്ങളുടെ ഡിവൈസിൽ GPS സപ്പോർട്ട് ചെയ്യുന്നില്ല.");
            }
        });

        // 5. Download KML Logic[cite: 1]
        downloadBtn.addEventListener('click', () => {
            try {
                if (!currentLayer) return;

                let combinedGeoJSON = {
                    type: "FeatureCollection",
                    features: []
                };

                currentLayer.eachLayer(layer => {
                    combinedGeoJSON.features.push(layer.toGeoJSON());
                });

                // Generate KML using Tokml[cite: 1]
                const kml = tokml(combinedGeoJSON, {
                    documentName: currentPanchayatName,
                    documentDescription: 'Ward Map with Transparent Area and Pink Lines'
                });
                
                const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentPanchayatName.replace(/\s+/g, '_')}_WardMap.kml`;
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("KML ഡൗൺലോഡ് ചെയ്യാൻ സാധിച്ചില്ല.");
            }
        });

        // 6. Home Button Logic
        function goHome() {
            page2.classList.remove('active');
            page1.classList.add('active');
            mapLoader.style.display = 'none';
            if (currentLayer) map.removeLayer(currentLayer);
            if (gpsMarker) map.removeLayer(gpsMarker);
        }
        
        homeBtn.addEventListener('click', goHome);

    </script>
</body>
</html>
